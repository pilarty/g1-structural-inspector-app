<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G1 Structural Inspector</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #FFFFFF; color: #14202B;
         font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; }
  main { max-width: 30rem; padding: 2rem; text-align: center; }
  h1 { margin: 1.2rem 0 .5rem; font-size: 1.5rem; font-weight: 600; letter-spacing: -.01em; }
  p { margin: 0 auto 1rem; color: #4A5662; line-height: 1.55; }
  .giro { width: 2rem; height: 2rem; margin: 1.4rem auto 0; border: 3px solid #D9D5CC; border-top-color: #377DC0;
          border-radius: 50%; animation: gira 0.9s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  button { margin: .25rem; padding: .65rem 1.2rem; border-radius: 6px; font: inherit; font-weight: 500; cursor: pointer;
           border: 1.5px solid #14202B; background: transparent; color: #14202B; }
  button.principal { background: #377DC0; border-color: #377DC0; color: #fff; }
  button:focus-visible { outline: 3px solid #377DC0; outline-offset: 2px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .giro { animation: none; } }
</style>
</head>
<body>
<main>
  <svg width="48" height="48" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#377DC0"/><path d="M9 13V9h4M23 13V9h-4M9 19v4h4M23 19v4h-4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="16" r="2.4" fill="#fff"/></svg>
  <h1 id="titulo">Iniciando el motor de detección…</h1>
  <p id="texto">Se está cargando la inteligencia artificial. La primera vez puede tardar hasta un minuto.</p>
  <div class="giro" id="giro" role="status" aria-label="Cargando"></div>
  <div id="acciones" hidden>
    <button class="principal" id="reintentar" type="button">Reintentar</button>
    <button id="registro" type="button">Ver registro</button>
  </div>
</main>
<script>
  var p = new URLSearchParams(location.search);
  if (p.get('estado') === 'error') {
    document.getElementById('titulo').textContent = 'No se pudo iniciar el motor de detección';
    document.getElementById('texto').textContent = (p.get('detalle') || 'Ocurrió un error inesperado.') +
      ' Si el problema sigue, cierra otras aplicaciones que usen mucha memoria y vuelve a intentarlo.';
    document.getElementById('giro').hidden = true;
    document.getElementById('acciones').hidden = false;
  }
  document.getElementById('reintentar').addEventListener('click', function () { window.g1motor.reintentar(); });
  document.getElementById('registro').addEventListener('click', function () { window.g1motor.verRegistro(); });
</script>
</body>
</html>
